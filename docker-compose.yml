services:
  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: web_edu_anaksehat
      DB_USERNAME: root
      DB_PASSWORD: secret
    volumes:
      - ./.env.docker:/var/www/.env
      - public-data:/var/www/public
      - storage-data:/var/www/storage/app/public
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - public-data:/var/www/public
      - storage-data:/var/www/storage/app/public
    depends_on:
      - app

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: web_edu_anaksehat
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  dbdata:
  public-data:
  storage-data:
