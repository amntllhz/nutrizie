server {
    listen 80;
    root /var/www/public;
    index index.php;

    # Semua request yang BUKAN file fisik (route Laravel) diarahkan
    # ke index.php — ini "front controller pattern" bawaan Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File .php TIDAK dieksekusi langsung oleh nginx (nginx bukan
    # interpreter PHP). Nginx cuma nerusin request ke PHP-FPM lewat
    # protokol FastCGI, PHP-FPM yang beneran ngejalanin kode PHP-nya.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}